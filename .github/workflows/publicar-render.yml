# Dispara a publicação do serviço sempre que a branch principal recebe um commit.
name: Publicar main no Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Solicitar deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Verificar segredo do Render
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "::error title=Configuração pendente::Cadastre RENDER_DEPLOY_HOOK_URL nos segredos do repositório."
          exit 1

      - name: Disparar publicação da main
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Solicitação de deploy aceita pelo Render."
